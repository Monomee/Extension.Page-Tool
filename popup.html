<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 330px; margin: 0; padding: 8px 12px 12px; color: #1f2328; }
  .row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid #eaeef2; }
  .info { flex: 1; }
  .info b { display: block; font-size: 14px; }
  .info small { display: block; color: #57606a; line-height: 1.4; margin-top: 2px; }
  .info kbd { font: 11px ui-monospace, monospace; background: #eaeef2; border-radius: 4px; padding: 1px 5px; color: #1f2328; }
  .go { border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; width: 30px; height: 28px; cursor: pointer; }
  .go:disabled { opacity: .35; cursor: default; }
  .sw { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: #d0d7de; border-radius: 20px; cursor: pointer; transition: .15s; }
  .sw span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .15s; }
  .sw input:checked + span { background: #1f883d; }
  .sw input:checked + span::before { transform: translateX(16px); }
  .sw input:focus-visible + span { outline: 2px solid #0969da; outline-offset: 2px; }
  label.key { display: block; margin-top: 10px; font-size: 12px; color: #57606a; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; margin-top: 3px; }
  a { color: #0969da; font-size: 12px; cursor: pointer; }
  #err { color: #cf222e; font-size: 12px; }
</style>
<div id="list"></div>
<label class="key">Claude API key (cho tính năng tóm tắt)
  <input id="key" type="password" placeholder="sk-ant-...">
</label>
<p style="margin:8px 0 0"><a id="shortcuts">Đổi phím tắt</a></p>
<div id="err"></div>
<script src="features.js"></script>
<script type="module" src="popup.js"></script>
